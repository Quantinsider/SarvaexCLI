openapi: 3.1.0
info:
  title: SarvaEX Public API
  version: 1.1.0
  description: 'Prediction-market exchange API. All prices are integer `price_ticks` (binary contracts: cents of a $1 payout;
    futures: see `settlement_rule.encoding`), sizes are whole contracts, money is micro-USDC. Every POST that changes state
    requires an `Idempotency-Key` header. Rate limits: 1200 reads / 240 writes per minute per credential.'
  contact:
    name: SarvaEX
    url: https://sarvaex.com
servers:
- url: https://api.sarvaex.com
  description: Production
- url: http://localhost:18080
  description: Local docker-compose
tags:
- name: markets
- name: orders
- name: account
- name: auth
- name: rfq
- name: exchange
- name: health
security:
- ApiKeyAuth: []
- BearerAuth: []
paths:
  /v1/health/overview:
    get:
      operationId: healthOverview
      tags:
      - health
      summary: Service health summary
      security: &id001 []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/auth/register:
    post:
      operationId: register
      tags:
      - auth
      summary: Create an account
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: *id002
  /v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Log in with email or user_id (returns a 1h bearer token)
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
  /v1/account/profile:
    get:
      operationId: getProfile
      tags:
      - account
      summary: Authenticated profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
  /v1/account/api-keys:
    get:
      operationId: listApiKeys
      tags:
      - auth
      summary: List API keys
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
    post:
      operationId: createApiKey
      tags:
      - auth
      summary: Create an API key (secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
  /v1/account/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      tags:
      - auth
      summary: Revoke an API key
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/markets:
    get:
      operationId: listMarkets
      tags:
      - markets
      summary: List contracts
      security: *id001
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - LISTED
          - OPEN
          - CLOSED
          - RESOLVING
          - SETTLED
          - CANCELLED
          - HALTED
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - BINARY
          - FUTURES
      - name: series_ticker
        in: query
        schema:
          type: string
      - name: event_ticker
        in: query
        schema:
          type: string
      - name: underlying
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: expected_resolution_from
        in: query
        schema:
          type: string
          format: date-time
      - name: expected_resolution_to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - &id004
        name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - contracts
                - next_cursor
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
  /v1/markets/{ticker}:
    get:
      operationId: getMarket
      tags:
      - markets
      summary: Contract details (fetch before trading)
      security: *id001
      parameters:
      - &id003
        name: ticker
        in: path
        required: true
        schema:
          type: string
        example: SX-FEDDEC-26OCT-H25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/markets/{ticker}/orderbook:
    get:
      operationId: getOrderbook
      tags:
      - markets
      summary: Order book snapshot
      security: *id001
      parameters:
      - *id003
      - name: depth
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBook'
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/markets/{ticker}/fills:
    get:
      operationId: getMarketFills
      tags:
      - markets
      summary: Recent public fills
      security: *id001
      parameters:
      - *id003
      - name: from_global_seq
        in: query
        schema:
          type: integer
      - name: to_global_seq
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fills:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicFill'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - fills
                - next_cursor
  /v1/markets/{ticker}/open-interest:
    get:
      operationId: getOpenInterest
      tags:
      - markets
      summary: Open interest
      security: *id001
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenInterest'
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/markets/{ticker}/settlement:
    get:
      operationId: getSettlement
      tags:
      - markets
      summary: Settlement result
      security: *id001
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/series:
    get:
      operationId: listSeries
      tags:
      - markets
      summary: List series
      security: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/Series'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - series
                - next_cursor
  /v1/events:
    get:
      operationId: listEvents
      tags:
      - markets
      summary: List events
      security: *id001
      parameters:
      - name: series_ticker
        in: query
        schema:
          type: string
      - name: expected_resolution_from
        in: query
        schema:
          type: string
          format: date-time
      - name: expected_resolution_to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - events
                - next_cursor
  /v1/events/{event_ticker}:
    get:
      operationId: getEvent
      tags:
      - markets
      summary: Event details
      security: *id001
      parameters:
      - name: event_ticker
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/events/{event_ticker}/resolution:
    get:
      operationId: getResolution
      tags:
      - markets
      summary: Resolution status
      security: *id001
      parameters:
      - name: event_ticker
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/orders:
    get:
      operationId: listOrders
      tags:
      - orders
      summary: List your orders
      parameters:
      - name: ticker
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - orders
                - next_cursor
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
    post:
      operationId: placeOrder
      tags:
      - orders
      summary: Place an order (scope trading:write)
      description: Response status 200 means accepted, not filled. Rejections are HTTP 400 with an OrderResponse body whose
        reject_code is set.
      parameters:
      - &id005
        name: Idempotency-Key
        in: header
        required: true
        description: Unique per logical action. Retrying with the same key returns the stored result; reusing it with a different
          body is a 409.
        schema:
          type: string
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '200':
          description: Accepted (check order.status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Rejected (OrderResponse with reject_code) or validation error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OrderResponse'
                - *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: *id002
        '429':
          description: Rate limited
          content:
            application/json:
              schema: *id002
  /v1/orders/{order_id}:
    get:
      operationId: getOrder
      tags:
      - orders
      summary: Get an order
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      tags:
      - orders
      summary: Cancel an order (scope trading:write)
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      - *id005
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Already terminal (reject_code ORDER_TERMINAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: *id002
  /v1/account/balance:
    get:
      operationId: getBalance
      tags:
      - account
      summary: Balance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/account/risk:
    get:
      operationId: getAccountRisk
      tags:
      - account
      summary: Risk summary and limits
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRisk'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/account/margin:
    get:
      operationId: getAccountMargin
      tags:
      - account
      summary: Portfolio margin breakdown by event
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/account/margin/preview:
    post:
      operationId: previewMargin
      tags:
      - account
      summary: What-if margin impact of an order (read-only, no Idempotency-Key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarginPreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginPreview'
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/account/history:
    get:
      operationId: getAccountHistory
      tags:
      - account
      summary: Ledger entries
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - entries
                - next_cursor
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/account/fills:
    get:
      operationId: getAccountFills
      tags:
      - account
      summary: Your fills
      parameters:
      - name: ticker
        in: query
        schema:
          type: string
      - name: order_id
        in: query
        schema:
          type: string
      - name: from_global_seq
        in: query
        schema:
          type: integer
      - name: to_global_seq
        in: query
        schema:
          type: integer
      - name: from_time
        in: query
        schema:
          type: string
          format: date-time
      - name: to_time
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fills:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrivateFill'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - fills
                - next_cursor
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/positions:
    get:
      operationId: listPositions
      tags:
      - account
      summary: Positions
      parameters:
      - name: include_closed
        in: query
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - *id004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  next_cursor:
                    type: string
                    description: Empty when there are no more pages.
                required:
                - positions
                - next_cursor
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
  /v1/positions/{ticker}:
    get:
      operationId: getPosition
      tags:
      - account
      summary: Position for one contract
      parameters:
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/demo/deposits/credit:
    post:
      operationId: creditDemoFunds
      tags:
      - account
      summary: 'Demo/devnet only: credit play money'
      parameters:
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoCreditRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  balance:
                    $ref: '#/components/schemas/Balance'
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: *id002
  /v1/rfqs:
    post:
      operationId: createRfq
      tags:
      - rfq
      summary: Create an RFQ
      parameters:
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRfq'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rfq:
                    $ref: '#/components/schemas/Rfq'
        '400':
          description: Validation error
          content:
            application/json:
              schema: *id002
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '403':
          description: Missing scope
          content:
            application/json:
              schema: *id002
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema: *id002
  /v1/rfqs/{rfq_id}:
    get:
      operationId: getRfq
      tags:
      - rfq
      summary: Get an RFQ
      parameters:
      - name: rfq_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rfq'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id002
  /v1/rfqs/{rfq_id}/quotes:
    get:
      operationId: listRfqQuotes
