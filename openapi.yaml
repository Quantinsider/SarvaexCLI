      - OPEN
      - PARTIAL
      - FILLED
      - CANCELLED
      - REJECTED
      - EXPIRED
      - TRIGGER_PENDING
      - TRIGGER_FIRED
      - TRIGGER_CANCELLED
      - TRIGGER_REJECTED
      - TRIGGER_EXPIRED
      description: TRIGGER_* statuses belong to stop and take-profit orders; they are listed only by asking for one of them
        in the status filter.
