components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'API key `svx_live_…`. Scopes: markets:read, account:read, orders:read, fills:read, trading:write, websocket:read.'
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 1-hour token from /v1/auth/login.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_ARGUMENT
            message:
              type: string
          required:
          - code
          - message
      required:
      - error
    Side:
      type: string
      enum:
      - 'YES'
      - 'NO'
      - LONG
      - SHORT
      description: YES/NO for binary contracts, LONG/SHORT for futures. Uppercase only.
    Action:
      type: string
      enum:
      - BUY
      - SELL
    OrderType:
      type: string
      enum:
      - LIMIT
      - MARKET
      - STOP_MARKET
      - STOP_LIMIT
      - TAKE_PROFIT
      - TAKE_PROFIT_LIMIT
      description: 'The four trigger types are futures only: the exchange places a market order (STOP_MARKET, TAKE_PROFIT)
        or a limit order at price_ticks (STOP_LIMIT, TAKE_PROFIT_LIMIT) when the last trade price reaches trigger_price_ticks.'
    Tif:
      type: string
      enum:
      - GTC
      - IOC
      - FOK
    Stp:
      type: string
      enum:
      - UNSPECIFIED
      - TAKER_AT_CROSS
      - MAKER
    OrderStatus:
      type: string
      enum:
