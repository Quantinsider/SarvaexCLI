name: ci
on:
  push:
    branches: [main]
    paths: ["sarvaex-cli/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["sarvaex-cli/**", ".github/workflows/ci.yml"]
defaults:
  run:
    working-directory: sarvaex-cli
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sarvaex-cli
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: OpenAPI is up to date
        run: pip install pyyaml && python3 scripts/gen_openapi.py /tmp/openapi.yaml && diff -q /tmp/openapi.yaml openapi.yaml
